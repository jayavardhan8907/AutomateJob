# Portal Scanner Configuration — Jayavardhan Kolla
# Profile: GenAI / AI Engineer | Healthcare AI + AI-first companies | Chennai India + International Remote
# Targets: AI Engineer, GenAI Engineer, LLM Engineer, ML Engineer, NLP Engineer
# Markets: India (16-18 LPA) + International Remote (USD)

# -- Title filter --
# At least 1 positive must match AND 0 negatives must match (case-insensitive).

title_filter:
  positive:
    # -- Core AI/ML roles --
    - "AI Engineer"
    - "AI Developer"
    - "Applied AI"
    - "GenAI"
    - "Generative AI"
    - "LLM"
    - "Machine Learning"
    - "ML Engineer"
    - "Deep Learning"
    - "NLP"
    - "NLP Engineer"
    # -- Agent/RAG/LLMOps --
    - "Agent"
    - "Agentic"
    - "RAG"
    - "LLMOps"
    - "MLOps"
    - "Prompt Engineer"
    # -- Healthcare/Clinical AI --
    - "Clinical AI"
    - "Healthcare AI"
    - "Medical AI"
    - "Health AI"
    - "AI Scribe"
    - "Ambient AI"
    # -- Voice/Speech AI --
    - "Voice AI"
    - "Conversational AI"
    - "Speech"
    # -- Broader AI Engineering --
    - "AI Software Engineer"
    - "AI Research Engineer"
    - "Data Scientist"
    - "Computer Vision"
    - "Multimodal"

  negative:
    # Roles outside target
    - "Intern"
    - ".NET"
    - "iOS"
    - "Android"
    - "PHP"
    - "Ruby"
    - "Embedded"
    - "Firmware"
    - "FPGA"
    - "ASIC"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "SAP "
    - "COBOL"
    - "Mainframe"
    - "Salesforce Admin"
    - "Oracle EBS"
    # Non-technical roles
    - "Sales Engineer"
    - "Account Executive"
    - "Account Manager"
    - "Marketing"
    - "Recruiter"
    - "HR "

  seniority_boost:
    - "Senior"
    - "Staff"
    - "Lead"
    - "Principal"

