name: Career Ops — Auto Scan

on:
  schedule:
    - cron: '0 3 */2 * *'   # every 2 days at 3am IST (9:30pm UTC)
  workflow_dispatch:          # also allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Bootstrap scan data files
        run: |
          mkdir -p data
          if [ ! -f data/pipeline.md ]; then
            cat <<'EOF' > data/pipeline.md
          # Pipeline

          ## Pendientes

          ## Procesadas
          EOF
          fi
          if [ ! -f data/scan-history.tsv ]; then
            echo -e "url\tfirst_seen\tportal\ttitle\tcompany\tstatus" > data/scan-history.tsv
          fi

      - name: Run scanner
        run: node scan.mjs

      - name: Commit scan results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "career-ops-bot"
          git config user.email "career-ops@github-actions"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git add data/pipeline.md data/scan-history.tsv
          git diff --staged --quiet || git commit -m "chore: auto-scan $(date +'%Y-%m-%d')"
          git push
